<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="毛天艺的微信读书笔记思维星图">
    <meta name="theme-color" content="#101414">
    <title>Reading Constellation · Mao Tianyi</title>
    <style>
        :root { --ink:#edf0e8; --muted:#949d98; --night:#0e1212; --panel:rgba(20,25,24,.91); --line:rgba(207,220,211,.2); --glow:#99d5bd; }
        * { box-sizing:border-box; }
        html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--night); color:var(--ink); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
        button,a { color:inherit; font:inherit; }
        button { cursor:pointer; }
        .space { position:fixed; inset:0; isolation:isolate; overflow:hidden; background:radial-gradient(circle at 52% 44%,#1a2422 0,#111817 38%,#0b0f0f 78%); }
        .space:before { content:""; position:absolute; z-index:-2; inset:-18%; background:radial-gradient(ellipse at 18% 16%,rgba(81,126,110,.18),transparent 30%),radial-gradient(ellipse at 82% 18%,rgba(110,78,137,.15),transparent 31%),radial-gradient(ellipse at 70% 88%,rgba(139,94,58,.12),transparent 36%),repeating-linear-gradient(101deg,rgba(255,255,255,.012) 0 1px,transparent 1px 8px); transform:rotate(-2deg); }
        .space:after { content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(0,0,0,.34),transparent 16% 79%,rgba(0,0,0,.4)),linear-gradient(180deg,rgba(255,255,255,.035),transparent 25% 75%,rgba(0,0,0,.45)); box-shadow:inset 0 0 120px rgba(0,0,0,.72); }
        canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }

        .topbar { position:fixed; z-index:12; top:max(14px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); right:max(14px,env(safe-area-inset-right)); display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:13px; align-items:start; pointer-events:none; }
        .back,.zoom button,.filter,.scope-button { pointer-events:auto; border:1px solid rgba(226,237,229,.34); background:rgba(17,22,21,.72); backdrop-filter:blur(12px); box-shadow:5px 7px 0 rgba(0,0,0,.2); }
        .back { width:44px; height:44px; display:grid; place-items:center; text-decoration:none; font-size:22px; transition:.2s; }
        .back:hover,.back:focus-visible,.zoom button:hover,.filter:hover,.filter.active,.scope-button:hover,.scope-button.active { color:#0e1412; background:#d9e8de; border-color:#d9e8de; outline:none; }
        .identity { min-width:0; padding-top:4px; }
        .identity strong { display:block; font:500 clamp(11px,1.2vw,14px)/1 Arial,sans-serif; letter-spacing:.23em; }
        .identity span { display:block; margin-top:7px; color:var(--muted); font:9px/1.4 Arial,sans-serif; letter-spacing:.08em; }
        .zoom { display:flex; gap:7px; pointer-events:auto; }
        .zoom button { width:38px; height:38px; padding:0; font-size:18px; }

        .discovery-tools { position:fixed; z-index:13; top:max(72px,calc(env(safe-area-inset-top) + 72px)); left:max(15px,env(safe-area-inset-left)); right:410px; display:grid; grid-template-columns:minmax(190px,290px) auto; gap:8px; align-items:start; pointer-events:none; }
        .search-box { position:relative; pointer-events:auto; }
        .search-box input { width:100%; height:36px; padding:0 38px 0 12px; color:#e3ebe5; border:1px solid rgba(226,237,229,.34); border-radius:0; outline:none; background:rgba(17,22,21,.82); backdrop-filter:blur(12px); box-shadow:5px 7px 0 rgba(0,0,0,.2); font:9px/1 Arial,"PingFang SC",sans-serif; letter-spacing:.05em; }
        .search-box input:focus { border-color:#b9dacb; box-shadow:5px 7px 0 rgba(0,0,0,.2),0 0 0 2px rgba(153,213,189,.12); }
        .search-box input::-webkit-search-cancel-button { display:none; }
        .search-clear { position:absolute; top:0; right:0; width:36px; height:36px; padding:0; color:#96a19b; border:0; background:transparent; font-size:16px; opacity:0; pointer-events:none; }
        .search-box.has-query .search-clear { opacity:1; pointer-events:auto; }
        .search-results { position:absolute; top:43px; left:0; right:0; display:none; max-height:min(54vh,420px); overflow:auto; padding:6px; background:rgba(15,20,19,.96); border:1px solid rgba(226,237,229,.24); box-shadow:10px 14px 30px rgba(0,0,0,.34); }
        .search-results.open { display:grid; gap:4px; }
        .search-result { width:100%; padding:9px 10px; display:grid; grid-template-columns:8px 1fr; gap:9px; color:#dce5df; text-align:left; border:0; background:transparent; }
        .search-result:hover,.search-result:focus-visible { outline:none; background:rgba(255,255,255,.07); }
        .search-result i { width:7px; height:7px; margin-top:3px; border-radius:50%; background:var(--node); box-shadow:0 0 8px var(--node); }
        .search-result strong { display:block; overflow:hidden; font:500 10px/1.35 Georgia,"Songti SC",serif; text-overflow:ellipsis; white-space:nowrap; }
        .search-result small { display:block; margin-top:3px; color:#78847e; font-size:7px; }
        .search-empty { padding:11px 10px; color:#78847e; font-size:8px; }
        .scope { display:flex; gap:6px; pointer-events:auto; }
        .scope-button { height:36px; padding:0 10px; color:#b9c3bd; font-size:8px; letter-spacing:.09em; white-space:nowrap; }
        .filters { position:fixed; z-index:12; top:max(117px,calc(env(safe-area-inset-top) + 117px)); left:max(15px,env(safe-area-inset-left)); right:410px; display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; pointer-events:none; }
        .filters::-webkit-scrollbar { display:none; }
        .filter { flex:0 0 auto; min-height:30px; padding:7px 10px 6px; color:#c4cbc7; font-size:8px; letter-spacing:.12em; text-transform:uppercase; }

        .status { position:fixed; z-index:10; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%); padding:9px 12px 8px; color:#aeb8b2; background:rgba(12,16,15,.74); border:1px solid rgba(225,235,228,.2); font:9px/1 Arial,sans-serif; letter-spacing:.08em; white-space:nowrap; transition:.25s; pointer-events:none; }
        .status.ready { opacity:0; transform:translate(-50%,8px); }

        .detail { position:fixed; z-index:14; top:0; right:0; width:min(390px,36vw); height:100%; padding:max(76px,calc(env(safe-area-inset-top) + 76px)) clamp(22px,2.2vw,34px) max(28px,env(safe-area-inset-bottom)); overflow:auto; background:linear-gradient(180deg,rgba(24,30,29,.97),rgba(12,16,15,.96)); border-left:1px solid rgba(222,234,226,.18); box-shadow:-24px 0 50px rgba(0,0,0,.3); transform:translateX(105%); transition:transform .32s cubic-bezier(.2,.8,.2,1); }
        .detail.open { transform:translateX(0); }
        .detail-close { position:absolute; top:max(17px,env(safe-area-inset-top)); right:max(17px,env(safe-area-inset-right)); width:38px; height:38px; padding:0; color:#d5ddd8; border:1px solid rgba(226,237,229,.28); background:transparent; font-size:22px; }
        .detail-kicker { margin:0 0 10px; color:var(--accent,#9dd3bd); font:9px/1 Arial,sans-serif; letter-spacing:.2em; text-transform:uppercase; }
        .detail h1 { margin:0; font:500 clamp(28px,3vw,46px)/1.02 Georgia,"Songti SC",serif; letter-spacing:-.04em; }
        .detail .question { margin:17px 0 0; color:#dde5df; font:500 16px/1.72 Georgia,"Songti SC",serif; }
        .detail .summary { margin:15px 0 0; color:#aeb8b2; font-size:12px; line-height:1.85; }
        .metric { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:24px 0 0; }
        .metric div { padding:11px 8px; border:1px solid rgba(220,232,224,.16); background:rgba(255,255,255,.025); }
        .metric b { display:block; font:500 19px/1 Georgia,serif; }
        .metric span { display:block; margin-top:6px; color:#7f8a84; font-size:7px; letter-spacing:.1em; }
        .detail h2 { margin:27px 0 10px; color:#7f8a84; font-size:8px; font-weight:400; letter-spacing:.18em; }
        .book-list { display:grid; gap:7px; }
        .book-chip { width:100%; padding:10px 11px; display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; color:#e0e6e2; text-align:left; border:1px solid rgba(222,234,226,.13); background:rgba(255,255,255,.025); }
        .book-chip:hover { border-color:var(--accent,#9dd3bd); }
        .book-chip img,.cover-fallback { width:34px; height:46px; object-fit:cover; background:#3e6355; }
        .book-chip strong { display:block; overflow:hidden; font:500 11px/1.4 Georgia,"Songti SC",serif; text-overflow:ellipsis; white-space:nowrap; }
        .book-chip small { display:block; margin-top:3px; color:#77827c; font-size:7px; }
        .book-chip i { color:#77827c; font:normal 9px/1 Arial; }
        .terms { display:flex; flex-wrap:wrap; gap:6px; }
        .terms span { padding:6px 8px; color:#aeb8b2; border:1px solid rgba(220,232,224,.15); font-size:8px; }
        .inference { margin-top:24px; padding:14px 15px; border-left:3px solid var(--accent,#9dd3bd); background:rgba(255,255,255,.03); color:#c6cfca; font:500 12px/1.8 Georgia,"Songti SC",serif; }
        .node-path { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:0 42px 17px 0; color:#77827c; font-size:8px; }
        .node-path button { padding:0; color:inherit; border:0; background:none; cursor:pointer; }
        .node-path button:hover { color:var(--accent,#9dd3bd); }
        .node-path i { font-style:normal; opacity:.5; }
        .notes-link { margin-top:16px; min-height:42px; display:flex; align-items:center; justify-content:space-between; padding:11px 13px; color:#0d1512; background:var(--accent,#9dd3bd); text-decoration:none; font-size:9px; letter-spacing:.08em; transition:.2s; }
        .notes-link:hover,.notes-link:focus-visible { transform:translateY(-2px); outline:1px solid #e8f2ec; outline-offset:2px; }
        .hint { position:fixed; z-index:8; left:18px; bottom:max(18px,env(safe-area-inset-bottom)); color:rgba(211,221,214,.5); font-size:8px; letter-spacing:.08em; pointer-events:none; }

        @media (max-width:900px) {
            .discovery-tools,.filters { right:15px; }
            .detail { top:auto; bottom:0; width:100%; height:min(64svh,620px); padding:55px 20px max(24px,env(safe-area-inset-bottom)); border-left:0; border-top:1px solid rgba(222,234,226,.18); transform:translateY(105%); border-radius:18px 18px 0 0; }
            .detail.open { transform:translateY(0); }
            .detail:before { content:""; position:absolute; top:10px; left:50%; width:42px; height:3px; border-radius:3px; background:rgba(231,239,234,.28); transform:translateX(-50%); }
            .detail-close { top:15px; }
            .detail h1 { font-size:32px; }
            .hint { display:none; }
        }
        @media (max-width:560px) {
            .topbar { grid-template-columns:auto 1fr auto; gap:9px; }
            .identity strong { font-size:9px; letter-spacing:.14em; }
            .identity span { font-size:7px; }
            .zoom button { width:34px; height:34px; }
            .zoom button:first-child { display:none; }
            .discovery-tools { top:max(62px,calc(env(safe-area-inset-top) + 62px)); grid-template-columns:minmax(0,1fr) auto; }
            .search-box input { height:33px; }
            .search-clear { width:33px; height:33px; }
            .search-results { top:39px; }
            .scope-button { height:33px; padding:0 8px; font-size:7px; }
            .filters { top:max(104px,calc(env(safe-area-inset-top) + 104px)); }
            .filter { min-height:27px; padding:6px 8px 5px; font-size:7px; }
            .detail { height:68svh; }
        }
        @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
    </style>
</head>
<body>
    <main class="space" aria-label="阅读思维星图">
        <canvas id="graph" aria-label="由微信读书笔记生成的交互式思维网络"></canvas>
        <header class="topbar">
            <a class="back" href="reading.html" aria-label="返回书架">←</a>
            <div class="identity"><strong>READING CONSTELLATION</strong><span id="sync-copy">正在读取你的笔记脉络</span></div>
            <div class="zoom" aria-label="星图控制"><button type="button" id="fit" aria-label="适合屏幕">◎</button><button type="button" id="zoom-in" aria-label="放大">＋</button><button type="button" id="zoom-out" aria-label="缩小">−</button></div>
        </header>
        <section class="discovery-tools" aria-label="检索与时间范围">
            <div class="search-box" id="search-box">
                <input id="node-search" type="search" autocomplete="off" placeholder="搜索书籍、作者、概念或笔记文字" aria-label="搜索阅读星图">
                <button class="search-clear" id="search-clear" type="button" aria-label="清除搜索">×</button>
                <div class="search-results" id="search-results" role="listbox" aria-label="搜索结果"></div>
            </div>
            <div class="scope" aria-label="阅读时间范围"><button class="scope-button active" type="button" data-range="all">全部时间</button><button class="scope-button" type="button" data-range="recent">近 90 天</button></div>
        </section>
        <nav class="filters" id="filters" aria-label="按探索方向筛选"></nav>
        <div class="status" id="status">正在从划线与分类中寻找重复出现的问题…</div>
        <div class="hint">拖动探索 · 滚轮缩放 · 点击节点展开</div>
    </main>

    <aside class="detail" id="detail" aria-live="polite">
        <button class="detail-close" id="detail-close" type="button" aria-label="关闭详情">×</button>
        <div id="detail-content"></div>
    </aside>

    <script>
        const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d');
        const detail=document.getElementById('detail'),detailContent=document.getElementById('detail-content');
        const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
        const THEMES=[
            {id:'freedom',label:'自由与规训',color:'#8fd4bd',question:'谁在塑造我的欲望、行为与选择？',summary:'从制度、意识形态与日常习惯反看“自由”：不仅摆脱外部控制，也要辨认已经被内化的尺度。',theory:'你正在把社会批判转向主体问题：先识别规训，再重建属于自己的判断。',keywords:['规训','惩罚','权力','操控','意识形态','工业社会','自由','控制','标准','主体','服从','占有','制度','安全','证明自己','选择'],concepts:[['discipline','规训','规训|惩罚|控制|服从|标准'],['power','权力','权力|操控|制度|工业社会'],['subject','主体性','主体|自己|自由|选择|真实']]},
            {id:'time',label:'时间与存在',color:'#e0bd67',question:'有限的生命，怎样才算真正属于自己？',summary:'笔记反复把时间看作生命本身：警惕拖延、忙碌与对未来的空许，回到当下、清醒和主动安排。',theory:'这里连接了斯多葛主义、存在主义与行动哲学：接受有限性，同时为当下负责。',keywords:['时间','生命','人生','短暂','当下','今日','明天','拖延','期待','忙碌','清醒','命运','苦难','习惯','焦虑','现在','心灵','生活'],concepts:[['finitude','有限性','短暂|有限|死亡|生命'],['present','当下','当下|今日|现在|清醒'],['fate','命运与适应','命运|苦难|习惯|适应']]},
            {id:'creation',label:'创作与成为',color:'#d694c1',question:'怎样把感受变成作品，并成为更真实的自己？',summary:'创作并非等待灵感，而是开放感知、保持纪律、设定标准并完成作品；作品记录的是不断变化的自己。',theory:'你关心的不是“如何更高产”，而是如何让直觉、纪律和高标准共同服务于真实表达。',keywords:['创作','艺术','作品','创意','灵感','才华','能量','直觉','纪律','完成','发布','新颖','独特','创造力','标准','奉献','感知','开放'],concepts:[['inspiration','灵感','灵感|直觉|启示|能量'],['practice','纪律与实践','纪律|习惯|日程|工作|完成'],['standard','作品标准','标准|伟大|质量|独特|新颖']]},
            {id:'desire',label:'欲望、价值与丰饶',color:'#e17863',question:'我真正想要什么，又愿意用什么交换？',summary:'从“需要”转向“想要”，从匮乏转向创造价值；但同时保留对消费尺度、占有和自我证明的警惕。',theory:'增长在你的笔记里不是单纯的数字，而是价值、身份与选择空间的重新组织。',keywords:['欲望','想要','需要','匮乏','丰饶','财富','金钱','价值','目标','增长','选择','标准','交换','追求','拥有','资源','能力','才能'],concepts:[['abundance','匮乏与丰饶','匮乏|丰饶|资源|需要|想要'],['value','价值创造','价值|财富|创造|才能|能力'],['desire','欲望尺度','欲望|目标|追求|标准|拥有']]},
            {id:'perception',label:'感知、自然与清醒',color:'#78af80',question:'如果换一个尺度观看，世界会显露什么？',summary:'自然、艺术与旅行共同训练注意力：放慢、留心、敬畏微小生命，并在简单之中恢复清醒。',theory:'你的自然书写不是逃离社会，而是在练习一种非占有、非工具化的观看方式。',keywords:['自然','植物','苔藓','森林','大海','天空','太阳','留心','看见','感知','敬畏','生命','简单','清醒','世界','宇宙','风景','观看'],concepts:[['attention','注意力','留心|看见|感知|观看'],['nature','自然尺度','自然|植物|苔藓|森林|大海|天空'],['clarity','清醒','清醒|简单|世界|生命']]},
            {id:'body',label:'身体与实践',color:'#6ea7d1',question:'思想怎样在身体、训练和恢复中落地？',summary:'训练科学、营养、恢复与重复练习构成了一条实践线：用身体反馈检验方法，而不是停留在抽象意愿。',theory:'身体成为你的第二种认识工具：进步来自可观察、可调整、可持续的实践。',keywords:['训练','运动','营养','身体','恢复','睡眠','脂肪','维生素','乳酸','有氧','ATP','细胞','表现','练习','竞技','健康','力量','速度'],concepts:[['training','训练方法','训练|练习|速度|力量|表现'],['nutrition','营养与能量','营养|维生素|脂肪|乳酸|ATP'],['recovery','恢复与适应','恢复|睡眠|适应|健康']]},
            {id:'relation',label:'爱、失去与关系',color:'#a697d8',question:'爱是占有、承诺，还是允许事物保持自身？',summary:'关于爱与失去的笔记同时出现：一边害怕获得后的丧失，一边追问非占有的爱、友谊与独处。',theory:'你正在区分亲密与占有：真正的关系既容纳脆弱，也不取消彼此的主权。',keywords:['爱','爱情','友谊','亲密','关系','失去','丧失','孤独','陪伴','占有','拥有','女人','朋友','欢乐','幸福','信任'],concepts:[['loss','得到与失去','失去|丧失|害怕|恐惧'],['love','爱与占有','爱|爱情|占有|拥有'],['friendship','友谊与独处','友谊|朋友|陪伴|孤独|亲密']]}
        ];
        const state={nodes:[],links:[],books:[],themes:[],selected:null,filter:'all',range:'all',search:'',searchMatches:new Set(),hover:null,width:0,height:0,dpr:1,camera:{x:0,y:0,zoom:1},drag:null,pointer:null,frame:0};

        function occurrences(text,term){if(!term)return 0;let count=0,from=0;while((from=text.indexOf(term,from))!==-1){count++;from+=term.length}return count}
        function noteBundle(raw={}){const highlights=raw.highlights?.updated||[];const thoughts=(raw.thoughts?.reviews||[]).map(x=>x.review||x).filter(Boolean);return{highlights,thoughts,text:[...highlights.map(x=>x.markText||''),...thoughts.flatMap(x=>[x.content||'',x.abstract||''])].join(' ')}}
        function latestFor(book,bundle){return Math.max(Number(book.readUpdateTime)||0,Number(book.lastNoteSort)||0,...bundle.highlights.map(x=>Number(x.createTime)||0),...bundle.thoughts.map(x=>Number(x.createTime)||0))}
        function buildGraph(data){
            const rawBooks=data.history?.books?.length?data.history.books:(data.shelf?.books||[]);

        document.getElementById('node-search').addEventListener('input',event=>runSearch(event.target.value));document.getElementById('node-search').addEventListener('focus',event=>{if(event.target.value)runSearch(event.target.value)});document.getElementById('search-clear').addEventListener('click',clearSearch);document.querySelectorAll('[data-range]').forEach(button=>button.addEventListener('click',()=>setRange(button.dataset.range)));document.addEventListener('pointerdown',event=>{if(!event.target.closest('#search-box'))document.getElementById('search-results').classList.remove('open')});document.addEventListener('keydown',event=>{if(event.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){event.preventDefault();document.getElementById('node-search').focus()}else if(event.key==='Escape'&&state.search){clearSearch()}else if(event.key==='Escape')closeDetail()});window.addEventListener('resize',()=>{resize();fitGraph()});

        async function load(){resize();try{const response=await fetch(`./data/weread.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error('同步数据暂时不可用');const data=await response.json();if(data.status!=='ready')throw new Error('微信读书正在同步');buildGraph(data);document.getElementById('sync-copy').textContent=`${state.books.length} 本书 · ${state.books.reduce((n,b)=>n+b.noteCount,0)} 条笔记 · ${data.updatedAt?new Date(data.updatedAt).toLocaleDateString('zh-CN'):'刚刚更新'}`;document.getElementById('status').classList.add('ready');requestAnimationFrame(loop)}catch(error){document.getElementById('status').textContent=`${error.message}，请稍后再来`;document.getElementById('sync-copy').textContent='等待微信读书同步'}}
        load();
    </script>
