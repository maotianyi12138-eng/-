<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAO TIANYI | ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;300;400;700&display=swap');
        
        body { 
            background-color: #000; color: #fff; margin: 0;
            font-family: 'Times New Roman', 'Noto Sans SC', serif;
            background-size: cover; background-position: center; 
            background-attachment: fixed; /* 电脑端保持固定 */
            overflow-x: hidden;
            transition: background-image 0.8s ease-in-out;
        }
        
        /* 移除全局所有加粗 */
        * { font-weight: 300 !important; }

        @media (min-width: 768px) { body { background-image: url('horse.jpg'); } }
        @media (max-width: 767px) { 
            body { 
                background-image: url('mobile_bg.jpg'); 
                background-attachment: scroll; /* 手机端禁止缩放关键：改为跟随滚动 */
            } 
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 0.5px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem;
        }

        .en-main { display: block; letter-spacing: 0.05em; text-transform: uppercase; }
        .zh-sub { display: block; opacity: 0.4; font-size: 0.75rem; line-height: 1.2; }
        
        .nav-active { border-left: 2px solid rgba(255,255,255,0.8) !important; background: rgba(255,255,255,0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tight-photo-grid { columns: 3; gap: 4px; }
        @media (min-width: 768px) { .tight-photo-grid { columns: 5; } }
        .photo-item { break-inside: avoid; margin-bottom: 4px; background: #111; border-radius: 8px; overflow: hidden; }

        .video-card-mini { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; border-radius: 1rem; transition: transform 0.3s ease; }
        .video-card-mini:hover { transform: scale(1.02); }

        .design-stack { position: relative; height: 260px; width: 100%; overflow: hidden; }
        .stack-layer { position: absolute; width: 60%; height: 90%; transition: 0.5s; border-radius: 8px; cursor: pointer; }
        .stack-layer:hover { transform: translateX(15px) scale(1.02); z-index: 60 !important; }

        .dragon-row { display: flex; overflow-x: auto; padding: 0; scrollbar-width: none; height: 100%; }
        .dragon-item { flex: 0 0 160px; margin-right: -100px; transition: 0.6s ease; cursor: pointer; position: relative; }
        .dragon-item:hover { margin-right: 20px; z-index: 100 !important; transform: scale(1.05); }
        .dragon-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }

        .artist-scroll { display: flex; gap: 4px; height: 100%; overflow: hidden; }
        .artist-strip { flex: 1; position: relative; transition: 0.5s ease; border-radius: 4px; overflow: hidden; }
        .artist-strip:hover { flex: 4; }
        .artist-strip img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; transition: 0.5s; }
        .artist-strip:hover img { opacity: 1; }

        .movie-list-4col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
        @media (max-width: 767px) { .movie-list-4col { grid-template-columns: repeat(2, 1fr); } }

        .apple-search {
            background: rgba(255, 255, 255, 0.05); border: 0.5px solid rgba(255, 255, 255, 0.1);
            color: #fff; border-radius: 12px; padding: 14px 20px; width: 100%; outline: none;
        }

        #viewer, #ad-pop { display: none; position: fixed; inset: 0; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #viewer { background: rgba(0,0,0,0.98); }

        body.reading-page { background:#cdd2d2!important; background-image:none!important; }
        body.reading-page #app-content { min-height:100svh; padding:0!important; }
        body.reading-page #music-toggle { display:none; }
        body.reading-page #back-btn {
            top:24px; left:24px; padding:11px 15px; color:#151819; opacity:.78;
            background:rgba(239,235,220,.74); border:1px solid rgba(21,24,25,.36);
            box-shadow:7px 8px 0 rgba(21,24,25,.12); backdrop-filter:blur(8px);
        }
        .reading-inline-frame { display:block; width:100%; height:100svh; border:0; background:#cdd2d2; }
        @media (max-width:760px) {
            .reading-inline-frame { height:200svh; }
            body.reading-page #back-btn { top:10px; left:10px; padding:7px 10px; box-shadow:4px 5px 0 rgba(21,24,25,.1); }
        }

        .thoughts-grid { width:min(1680px,100%); margin:0 auto; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; align-items:start; }
        .thought-card { position:relative; min-width:0; height:270px; overflow:hidden; display:flex; flex-direction:column; background:rgba(9,10,10,.34); border:1px solid rgba(255,255,255,.13); padding:1.15rem; border-radius:1.2rem; cursor:pointer; transition:background .3s,transform .3s,border-color .3s; box-shadow:0 18px 40px rgba(0,0,0,.14); }
        .thought-card:after { content:""; position:absolute; z-index:2; left:0; right:0; bottom:0; height:42%; background:linear-gradient(transparent,rgba(8,9,9,.94)); pointer-events:none; transition:opacity .25s; }
        .thought-card:hover { background:rgba(255,255,255,.075); transform:translateY(-3px); border-color:rgba(255,255,255,.24); }
        .thought-card.expanded { grid-column:span 2; height:auto; min-height:270px; max-height:none; background:rgba(8,9,9,.68); border-color:rgba(255,255,255,.27); cursor:zoom-out; }
        .thought-card.expanded:after { opacity:0; }
        .thought-date { flex:0 0 auto; }
        .thought-text { position:relative; z-index:1; margin:0; color:rgba(255,255,255,.9); font:300 13px/1.72 'Noto Sans SC',sans-serif; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:10; -webkit-box-orient:vertical; overflow:hidden; }
        .thought-card.expanded .thought-text { display:block; overflow:visible; }
        .thought-expand-hint { position:absolute; z-index:3; left:1.15rem; bottom:.85rem; color:rgba(255,255,255,.54); font:300 8px/1 'Noto Sans SC',sans-serif; letter-spacing:.12em; }
        .thought-card.expanded .thought-expand-hint { position:relative; left:auto; bottom:auto; margin-top:1.1rem; align-self:flex-end; }
        .thought-images { display:none; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:1rem; }
        .thought-card.expanded .thought-images { display:grid; }
        .thought-image-item { width: 100%; border: 0; padding: 0; background: transparent; border-radius: 10px; overflow: hidden; cursor: zoom-in; }
        .thought-image-item img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; transition: transform 0.25s ease; }
        .thought-image-item:hover img { transform: scale(1.03); }
        @media (max-width: 767px) {
            .thoughts-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
            .thought-card { height:220px; min-height:0; padding:.9rem; border-radius:1rem; }
            .thought-card.expanded { grid-column:1/-1; height:auto; min-height:220px; }
            .thought-text { font-size:11px; line-height:1.65; -webkit-line-clamp:9; }
            .thought-expand-hint { left:.9rem; bottom:.7rem; }
        }
        @media (min-width:768px) and (max-width:1023px) {
            .thoughts-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
            .thought-card.expanded { grid-column:span 2; }
        }

        body.calligraphy-page { background-color:#b8b0a3!important; background-image:linear-gradient(180deg,#d8d2c8 0%,#c9c1b5 60%,#958a7b 100%)!important; color:#27231d; }
        body.calligraphy-page #app-content { padding:0!important; }
        body.calligraphy-page #back-btn,
        body.calligraphy-page #music-toggle { color:#28241e; opacity:.7; background:rgba(244,240,231,.62); border:1px solid rgba(44,38,30,.22); box-shadow:0 8px 24px rgba(51,42,31,.12); backdrop-filter:blur(10px); }
        .ink-gallery-page { position:relative; isolation:isolate; min-height:100svh; overflow:hidden; padding:clamp(76px,9vh,112px) 0 clamp(76px,9vh,116px); background:linear-gradient(90deg,rgba(89,78,62,.13) 1px,transparent 1px) 0 0/18% 100%,linear-gradient(180deg,#ded8cd 0%,#cbc3b7 73%,#968a7b 73%,#817464 100%); box-shadow:inset 0 30px 70px rgba(255,255,255,.35),inset 0 -34px 80px rgba(54,43,31,.2); }
        .ink-gallery-page:before { content:""; position:absolute; z-index:0; inset:0 0 27%; pointer-events:none; background:radial-gradient(ellipse at 18% -8%,rgba(255,251,226,.94) 0,rgba(255,247,211,.38) 19%,transparent 47%),radial-gradient(ellipse at 50% -8%,rgba(255,251,226,.9) 0,rgba(255,247,211,.34) 20%,transparent 48%),radial-gradient(ellipse at 82% -8%,rgba(255,251,226,.9) 0,rgba(255,247,211,.34) 20%,transparent 48%); mix-blend-mode:screen; }
        .ink-gallery-page:after { content:""; position:absolute; z-index:0; left:-10%; right:-10%; bottom:-10%; height:38%; pointer-events:none; transform:perspective(600px) rotateX(58deg); transform-origin:50% 100%; background:repeating-linear-gradient(90deg,rgba(58,47,36,.14) 0 1px,transparent 1px 9%),linear-gradient(180deg,#a89d8d,#766958); box-shadow:inset 0 2px rgba(255,255,255,.35); }
        .ink-gallery-plaque { position:relative; z-index:3; width:max-content; max-width:calc(100% - 40px); margin:0 auto clamp(28px,4vh,48px); padding:9px 15px 8px; text-align:center; color:#40382e; background:#e8e2d7; border:1px solid rgba(63,52,39,.22); box-shadow:0 7px 18px rgba(62,50,36,.1); }
        .ink-gallery-plaque-title { display:block; font:300 10px/1.2 'Noto Sans SC',sans-serif; letter-spacing:.22em; }
        .ink-gallery-status { display:block; margin-top:5px; color:#766d61; font:300 8px/1.2 'Noto Sans SC',sans-serif; letter-spacing:.11em; }
        .ink-gallery-shell { position:relative; z-index:2; width:min(1780px,100%); margin:0 auto; padding:0 0 clamp(16px,3vh,32px); overflow:hidden; }
        .ink-gallery-track { display:grid; grid-auto-flow:column; grid-auto-columns:clamp(270px,25vw,390px); align-items:center; gap:clamp(28px,3.2vw,58px); overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none; padding:34px clamp(38px,6vw,106px) 54px; }
        .ink-gallery-track::-webkit-scrollbar { display:none; }
        .ink-frame { scroll-snap-align:center; position:relative; height:clamp(420px,62vh,690px); display:grid; grid-template-rows:minmax(0,1fr) auto; padding:clamp(13px,1.35vw,19px); color:#242019; background:#ede7dc; border:clamp(7px,.7vw,11px) solid #332c23; box-shadow:0 31px 40px rgba(53,42,29,.26),0 6px 13px rgba(53,42,29,.25),inset 0 0 0 2px rgba(255,255,255,.74); transform:none; cursor:zoom-in; transition:transform .35s ease,box-shadow .35s ease; }
        .ink-frame:before { content:""; position:absolute; inset:-54px -34px 52%; z-index:-1; background:radial-gradient(ellipse at 50% 0,rgba(255,247,213,.75),transparent 68%); pointer-events:none; }
        .ink-frame:hover { transform:translateY(-5px); box-shadow:0 37px 50px rgba(53,42,29,.3),0 8px 16px rgba(53,42,29,.24),inset 0 0 0 2px rgba(255,255,255,.8); }
        .ink-art { min-height:0; display:grid; place-items:center; overflow:hidden; background:#f7f3e9; border:1px solid rgba(71,59,44,.18); box-shadow:inset 0 0 34px rgba(83,66,45,.08); }
        .ink-art img { width:100%; height:100%; object-fit:contain; display:block; filter:contrast(1.02) saturate(.92); transition:transform .45s; }
        .ink-frame:hover .ink-art img { transform:scale(1.012); }
        .ink-caption { display:flex; justify-content:space-between; gap:12px; padding:12px 2px 0; color:#40372d; font:300 9px/1.4 'Noto Sans SC',sans-serif; letter-spacing:.11em; }
        .ink-gallery-controls { display:flex; justify-content:center; align-items:center; gap:14px; }
        .ink-gallery-controls button { width:39px; height:39px; border:1px solid rgba(54,45,34,.28); border-radius:50%; color:#41382d; background:rgba(238,232,220,.72); box-shadow:0 8px 22px rgba(54,45,34,.12); cursor:pointer; transition:.2s; }
        .ink-gallery-controls button:hover { color:#17130f; background:#f3eee4; transform:translateY(-2px); }
        .ink-gallery-count { min-width:76px; text-align:center; color:#655b4f; font-size:9px; letter-spacing:.14em; }
        .ink-empty { min-height:52vh; display:grid; place-items:center; padding:32px; text-align:center; color:#5d5347; }
        @media (max-width:767px) {
            .ink-gallery-page { min-height:100svh; padding:68px 0 58px; background:linear-gradient(180deg,#dcd6ca 0%,#cbc2b4 87%,#978b7b 87%,#837564 100%); }
            .ink-gallery-page:after { display:none; }
            .ink-gallery-plaque { margin-bottom:14px; padding:8px 12px 7px; }
            .ink-gallery-track { grid-auto-columns:82vw; gap:18px; padding:22px 9vw 38px; }
            .ink-frame { height:64svh; min-height:440px; border-width:7px; padding:10px; box-shadow:0 22px 30px rgba(53,42,29,.26),0 5px 11px rgba(53,42,29,.2),inset 0 0 0 2px rgba(255,255,255,.7); }
            .ink-frame:hover { transform:none; }
            body.calligraphy-page #back-btn { top:10px; left:10px; }
        }

        body.sports-page { background:#090b0b!important; background-image:none!important; }
        body.sports-page #app-content { min-height:100svh; padding:0!important; }
        body.sports-page #back-btn,
        body.sports-page #music-toggle { background:rgba(15,18,17,.56); border:1px solid rgba(219,229,214,.14); backdrop-filter:blur(12px); }
        .training-room { --lime:#c9edb3; --mint:#91c8aa; --paper:#e8eee5; position:relative; isolation:isolate; min-height:100svh; overflow:hidden; padding:clamp(78px,10vh,118px) clamp(18px,4.5vw,76px) 70px; color:var(--paper); background:linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px) 0 0/16.666% 100%,linear-gradient(180deg,#101514 0%,#090c0c 72%,#050707 72%); }
        .training-room:before { content:""; position:absolute; z-index:-2; inset:0 0 28%; pointer-events:none; background:radial-gradient(ellipse at 22% -12%,rgba(190,235,188,.2),transparent 46%),radial-gradient(ellipse at 78% -18%,rgba(128,182,160,.15),transparent 43%),linear-gradient(115deg,transparent 0 28%,rgba(207,239,205,.035) 29% 36%,transparent 37% 100%); }
        .training-room:after { content:""; position:absolute; z-index:-1; left:-16%; right:-16%; bottom:-20%; height:50%; transform:perspective(760px) rotateX(60deg); transform-origin:50% 100%; pointer-events:none; background:repeating-linear-gradient(90deg,rgba(186,220,194,.07) 0 1px,transparent 1px 8%),repeating-linear-gradient(0deg,rgba(186,220,194,.055) 0 1px,transparent 1px 22%),linear-gradient(180deg,#111817,#050706); box-shadow:inset 0 2px rgba(213,239,218,.12); }
        .training-shell { position:relative; z-index:2; width:min(1640px,100%); margin:auto; }
        .training-intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin:0 0 clamp(28px,4vh,48px); }
        .training-title { margin:0; font:300 clamp(31px,5.3vw,74px)/.9 'Times New Roman','Noto Sans SC',serif; letter-spacing:-.035em; }
        .training-title small { display:block; margin-top:14px; color:rgba(232,238,229,.44); font:300 10px/1.3 'Noto Sans SC',sans-serif; letter-spacing:.26em; }
        .training-sync { max-width:310px; text-align:right; color:rgba(232,238,229,.43); font:300 9px/1.6 'Noto Sans SC',sans-serif; letter-spacing:.12em; }
        .training-sync:before { content:""; display:inline-block; width:6px; height:6px; margin-right:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 14px rgba(201,237,179,.72); }
        .training-grid { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(280px,.75fr); gap:clamp(12px,1.5vw,22px); }
        .training-panel { position:relative; overflow:hidden; border:1px solid rgba(223,237,223,.12); border-radius:22px; background:linear-gradient(145deg,rgba(28,36,34,.72),rgba(7,10,10,.82)); box-shadow:0 28px 70px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.045); backdrop-filter:blur(16px); }
        .training-panel:before { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(120deg,rgba(211,239,209,.045),transparent 32%); }
        .training-metrics { grid-column:1/-1; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:rgba(220,236,220,.1); }
        .training-metric { min-height:124px; padding:22px clamp(16px,2vw,28px); background:#101514; }
        .training-metric-label { color:rgba(232,238,229,.42); font:300 9px/1.2 'Noto Sans SC',sans-serif; letter-spacing:.16em; }
        .training-metric-value { display:block; margin-top:18px; color:#eff5ed; font:300 clamp(25px,3vw,42px)/1 'Times New Roman',serif; letter-spacing:-.025em; }
        .training-metric-value small { margin-left:5px; color:rgba(232,238,229,.38); font:300 9px/1 'Noto Sans SC',sans-serif; letter-spacing:.08em; }
        .training-panel-pad { padding:clamp(20px,2.2vw,34px); }
        .training-panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
        .training-kicker { display:block; color:rgba(232,238,229,.4); font:300 9px/1.25 'Noto Sans SC',sans-serif; letter-spacing:.18em; text-transform:uppercase; }
        .training-panel-title { display:block; margin-top:6px; color:#edf3eb; font:300 18px/1.2 'Noto Sans SC',sans-serif; letter-spacing:.04em; }
        .training-period { color:rgba(232,238,229,.35); font:300 8px/1.3 'Noto Sans SC',sans-serif; letter-spacing:.12em; white-space:nowrap; }
        .training-chart { display:block; width:100%; height:270px; }
        .body-chart { height:178px; }
        .training-side { display:grid; gap:clamp(12px,1.5vw,22px); align-content:start; }
        .training-body-latest { display:flex; align-items:baseline; justify-content:space-between; gap:18px; margin-top:2px; }
        .training-body-number { color:#f0f5ed; font:300 34px/1 'Times New Roman',serif; }
        .training-body-number small { color:rgba(232,238,229,.38); font:300 9px/1 'Noto Sans SC',sans-serif; }
        .training-body-fat { color:rgba(201,237,179,.8); font:300 11px/1.3 'Noto Sans SC',sans-serif; letter-spacing:.08em; text-align:right; }
        .training-moves { display:grid; gap:15px; margin-top:22px; }
        .training-move-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; align-items:center; }
        .training-move-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(239,245,237,.82); font:300 11px/1.2 'Noto Sans SC',sans-serif; }
        .training-move-count { color:rgba(232,238,229,.34); font-size:8px; letter-spacing:.1em; }
        .training-move-track { grid-column:1/-1; height:2px; overflow:hidden; background:rgba(232,238,229,.08); }
        .training-move-fill { height:100%; background:linear-gradient(90deg,var(--mint),var(--lime)); box-shadow:0 0 12px rgba(201,237,179,.35); }
        .training-history { grid-column:1/-1; }
        .training-sessions { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
        .training-session { min-width:0; padding:17px; border:1px solid rgba(232,238,229,.09); border-radius:14px; background:rgba(4,7,7,.3); }
        .training-session-date { color:rgba(201,237,179,.58); font:300 8px/1 'Noto Sans SC',sans-serif; letter-spacing:.13em; }
        .training-session-title { min-height:34px; margin:11px 0 15px; color:rgba(242,246,240,.92); font:300 13px/1.35 'Noto Sans SC',sans-serif; }
        .training-session-meta { display:flex; flex-wrap:wrap; gap:6px 12px; color:rgba(232,238,229,.35); font:300 8px/1.3 'Noto Sans SC',sans-serif; letter-spacing:.05em; }
        .training-empty { min-height:58vh; display:grid; place-items:center; padding:40px; text-align:center; color:rgba(232,238,229,.5); }
        .training-empty-dot { width:8px; height:8px; margin:0 auto 18px; border-radius:50%; background:var(--lime); box-shadow:0 0 22px rgba(201,237,179,.82); animation:trainingPulse 1.6s ease-in-out infinite; }
        @keyframes trainingPulse { 50% { opacity:.25; transform:scale(.7); } }
        @media (max-width:900px) {
            .training-grid { grid-template-columns:1fr; }
            .training-side,.training-history { grid-column:1; }
            .training-sessions { grid-template-columns:repeat(2,minmax(0,1fr)); }
        }
        @media (max-width:640px) {
            .training-room { padding:70px 10px 44px; background:linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/50% 100%,linear-gradient(180deg,#101514,#070909); }
            .training-room:after { display:none; }
            .training-intro { align-items:flex-start; flex-direction:column; gap:13px; margin-bottom:22px; padding:0 6px; }
            .training-title { font-size:40px; }
            .training-title small { margin-top:9px; font-size:8px; }
            .training-sync { text-align:left; font-size:8px; }
            .training-grid { gap:9px; }
            .training-panel { border-radius:16px; }
            .training-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .training-metric { min-height:99px; padding:16px; }
            .training-metric-value { margin-top:13px; font-size:29px; }
            .training-panel-pad { padding:18px 15px; }
            .training-chart { height:218px; }
            .body-chart { height:150px; }
            .training-sessions { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding-bottom:2px; }
            .training-sessions::-webkit-scrollbar { display:none; }
            .training-session { flex:0 0 76%; scroll-snap-align:start; }
            body.sports-page #back-btn { top:10px; left:10px; }
        }

        .more-menu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; }
        .more-menu:before { display:none; }
        .more-menu > div { min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 7px; }
        .more-practice-cell { display:grid!important; grid-template-columns:repeat(2,minmax(0,1fr)); padding:0!important; }
        .more-practice-cell button { min-width:0; color:inherit; cursor:pointer; }

        function escapeHtml(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function getWorksCategoryById(id) {
            return worksCategories.find(c => c.id === id);
        }

        function parseWorksProjectFromFile(filePath) {
            const rawName = decodeURIComponent((filePath.split('/').pop() || '').trim());
            const extLess = rawName.replace(/\.[^.]+$/, '');
            const cleanBase = extLess.replace(/[.。](pic|heic|jpeg|jpg|png|webp|gif)$/i, '');
            const match = cleanBase.match(/^(.*?)(?:[\s_-]*(\d+))$/);
            const projectName = (match?.[1] || cleanBase || '未命名项目').trim();
            const order = match?.[2] ? parseInt(match[2], 10) : Number.MAX_SAFE_INTEGER;
            return { projectName, order };
        }

        function groupWorksProjects(files = []) {
            const projectMap = new Map();
            const sorted = [...files].sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }));
            sorted.forEach(path => {
                const { projectName, order } = parseWorksProjectFromFile(path);
                if (!projectMap.has(projectName)) projectMap.set(projectName, []);
                projectMap.get(projectName).push({ path, order });
            });

            return [...projectMap.entries()]
                .map(([name, images]) => ({
                    name,
                    images: images
                        .sort((a, b) => a.order - b.order || a.path.localeCompare(b.path, 'zh-Hans-CN', { numeric: true }))
                        .map(item => item.path)
                }))
                .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true }));
        }

        async function fetchWorksFilesFromDirectory(dirPath) {
            try {
                const res = await fetch(encodeURI(`${dirPath}/`), { cache: 'no-store' });
                if (!res.ok) return [];
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const hrefs = [...doc.querySelectorAll('a[href]')].map(a => a.getAttribute('href') || '');
                const files = hrefs
                    .filter(href => href && !href.startsWith('?') && !href.startsWith('#') && !href.endsWith('/'))
                    .map(href => decodeURIComponent(href.split('/').pop() || '').trim())
                    .filter(name => /\.(png|jpe?g|webp|gif)$/i.test(name))
                    .map(name => `${dirPath}/${name}`);
                return [...new Set(files)];
            } catch (_) {
                return [];
            }
        }

            renderWorksProjectDetail(categoryId, project);

        const calligraphyState = { items: [], current: 0, signature: '', refreshTimer: 0 };

        function calligraphyLabel(name = '') {
            return decodeURIComponent(name).replace(/\.[^.]+$/, '').replace(/[_]/g, ' · ').replace(/-/g, '.');
        }

        function normalizeCalligraphyItems(payload = []) {
            return (Array.isArray(payload) ? payload : [])
                .filter(item => (!item.type || item.type === 'file') && /\.(png|jpe?g|webp|gif)$/i.test(item.name || '') && !/^latest\./i.test(item.name || ''))
                .sort((a, b) => b.name.localeCompare(a.name, 'zh-Hans-CN', { numeric: true }))
                .map(item => ({ name: item.name, src: item.download_url || item.src || encodeURI(item.path || '') }))
                .filter(item => item.name && item.src);
        }

        function renderCalligraphyItems(items) {
            const track = document.getElementById('ink-gallery-track');
            const count = document.getElementById('ink-gallery-count');
            const status = document.getElementById('ink-gallery-status');
            if (!track) return;
            const signature = items.map(item => `${item.name}:${item.src}`).join('|');
            calligraphyState.items = items;
            if (signature !== calligraphyState.signature || !track.querySelector('.ink-frame')) {
                calligraphyState.signature = signature;
                track.innerHTML = items.map((item, index) => `
                    <article class="ink-frame" onclick="openCalligraphyViewer(${index})">
                        <div class="ink-art"><img src="${escapeHtml(item.src)}" loading="${index < 3 ? 'eager' : 'lazy'}" decoding="async" alt="${escapeHtml(calligraphyLabel(item.name))} 书法练习"></div>
                        <div class="ink-caption"><span>${escapeHtml(calligraphyLabel(item.name))}</span><span>${String(index + 1).padStart(2, '0')}</span></div>
                    </article>`).join('');
                calligraphyState.current = 0;
                track.scrollLeft = 0;
            }
            if (status) status.textContent = `AUTO INDEX · ${items.length} WORK${items.length === 1 ? '' : 'S'}`;
            updateCalligraphyCount();
        }

        async function loadCalligraphyGallery({ silent = false } = {}) {
            const track = document.getElementById('ink-gallery-track');
            const count = document.getElementById('ink-gallery-count');
            const status = document.getElementById('ink-gallery-status');
            if (!track) return;
            window.clearTimeout(calligraphyState.refreshTimer);
            if (!silent && status) status.textContent = 'AUTO INDEX · SEARCHING';
            try {
                const response = await fetch(CALLIGRAPHY_ENDPOINT, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
                if (!response.ok) throw new Error('暂时没有作品');
                const payload = await response.json();
                const items = normalizeCalligraphyItems(payload);
                if (!items.length) throw new Error('暂时没有作品');
                try { localStorage.setItem(CALLIGRAPHY_CACHE_KEY, JSON.stringify(items)); } catch (_) {}
                renderCalligraphyItems(items);
            } catch (error) {
                let cachedItems = [];
                try { cachedItems = normalizeCalligraphyItems(JSON.parse(localStorage.getItem(CALLIGRAPHY_CACHE_KEY) || '[]')); } catch (_) {}
                const items = cachedItems.length ? cachedItems : normalizeCalligraphyItems(calligraphyFallbackItems);
                if (items.length) {
                    renderCalligraphyItems(items);
                    if (status) status.textContent = `CACHED INDEX · ${items.length} WORK${items.length === 1 ? '' : 'S'}`;
                } else {
                    track.innerHTML = `<div class="ink-empty"><div><span class="en-main text-xs">AWAITING TODAY'S INK</span><span class="zh-sub mt-3 opacity-70">把作品上传到“书法”文件夹，建议命名为 YYYY-MM-DD.jpg</span></div></div>`;
                    if (count) count.textContent = '0 / 0';
                    if (status) status.textContent = 'AUTO INDEX · STANDBY';
                }
            }
            calligraphyState.refreshTimer = window.setTimeout(() => {
                if (document.body.classList.contains('calligraphy-page')) loadCalligraphyGallery({ silent: true });
            }, 120000);
        }

        function updateCalligraphyCount() {
            const track = document.getElementById('ink-gallery-track');
            const count = document.getElementById('ink-gallery-count');
            if (!track || !count || !calligraphyState.items.length) return;
            const frames = [...track.querySelectorAll('.ink-frame')];
            const center = track.scrollLeft + track.clientWidth / 2;
            let nearest = 0;
            frames.forEach((frame, index) => {
                const frameCenter = frame.offsetLeft + frame.offsetWidth / 2;
                if (Math.abs(frameCenter - center) < Math.abs((frames[nearest]?.offsetLeft || 0) + (frames[nearest]?.offsetWidth || 0) / 2 - center)) nearest = index;
            });
            calligraphyState.current = nearest;
            count.textContent = `${nearest + 1} / ${calligraphyState.items.length}`;
        }

        function moveCalligraphy(direction) {
            const track = document.getElementById('ink-gallery-track');
            if (!track) return;
            track.scrollBy({ left: direction * Math.max(260, track.clientWidth * .72), behavior: 'smooth' });
        }

        function openCalligraphyViewer(index) {
            currentImgList = calligraphyState.items.map(item => item.src);
            currentIndex = Math.max(0, Math.min(index, currentImgList.length - 1));
            updateViewer();
            document.getElementById('viewer').style.display = 'flex';
        }

        function renderCalligraphy() {
            app.innerHTML = `
                <div class="ink-gallery-page">
                    <header class="ink-gallery-plaque">
                        <span class="ink-gallery-plaque-title">DAILY INK · 书法日常</span>
                        <span id="ink-gallery-status" class="ink-gallery-status">AUTO INDEX · SEARCHING</span>
                    </header>
                    <section class="ink-gallery-shell" aria-label="每日书法作品画廊">
                        <div id="ink-gallery-track" class="ink-gallery-track"><div class="ink-empty"><span class="en-main text-xs">LOADING GALLERY...</span></div></div>
                        <div class="ink-gallery-controls">
                            <button type="button" onclick="moveCalligraphy(-1)" aria-label="上一组书法作品">←</button>
                            <span id="ink-gallery-count" class="ink-gallery-count">— / —</span>
                            <button type="button" onclick="moveCalligraphy(1)" aria-label="下一组书法作品">→</button>
                        </div>
                    </section>
                </div>`;
            document.getElementById('ink-gallery-track')?.addEventListener('scroll', updateCalligraphyCount, { passive: true });
            loadCalligraphyGallery();
        }

        const sportsState = { data: null, resizeBound: false, resizeTimer: 0, filter: null, preview: null, exerciseGroups: null, activeExercise: {}, timelineRange: '' };

        function sportsNumber(value, maximumFractionDigits = 0) {
            const number = Number(value);
            if (!Number.isFinite(number)) return '—';
            return new Intl.NumberFormat('zh-CN', { maximumFractionDigits }).format(number);
        }

        function sportsDate(value) {
            if (!value) return '—';
            const date = new Date(`${String(value).slice(0, 10)}T12:00:00`);
            return Number.isNaN(date.getTime()) ? String(value) : new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit' }).format(date);
        }

        function sportsFullDate(value) {
            if (!value) return '—';
            const date = new Date(`${String(value).slice(0, 10)}T12:00:00`);
            return Number.isNaN(date.getTime()) ? String(value) : new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
        }

        function sportsMovementGroup(value = '') {
            const text = String(value || '');
            if (/胸|卧推|飞鸟|胸推|夹胸|俯卧撑|bench|chest|pec/i.test(text)) return 'chest';
            if (/背|引体|高位下拉|杠铃划船|器械划船|直臂下压|硬拉|pull.?up|lat.?pull|deadlift/i.test(text)) return 'back';
            if (/腿|深蹲|腿举|腿弯举|髋|小腿|箭步|臀|squat|lunge/i.test(text)) return 'leg';
            return 'other';
        }

        function sportsGroup(session = {}) {
            const titleGroup = sportsMovementGroup(session.title);
            if (titleGroup !== 'other') return titleGroup;
            for (const move of session.movements || []) {
                const group = sportsMovementGroup(move.name);
                if (group !== 'other') return group;
            }
            return 'other';
        }

        function sportsExerciseGroups(sessions) {
            const maps = { chest: new Map(), back: new Map(), leg: new Map() };
            sessions.forEach(session => (session.movements || []).forEach(move => {
                const name = String(move.name || '未命名动作');
                const group = sportsMovementGroup(name);
                if (group === 'other') return;
                const exercise = maps[group].get(name) || { name, totalSets: 0, totalReps: 0, totalVolume: 0, maxWeight: 0, points: [] };
                const point = {
                    date: String(session.date || '').slice(0, 10),
                    sets: Number(move.setCount || 0),
                    reps: Number(move.totalReps || 0),
                    volume: Number(move.volumeKg || 0),
                    maxWeight: Number(move.maxWeightKg || 0)
                };
                exercise.totalSets += point.sets;
                exercise.totalReps += point.reps;
                exercise.totalVolume += point.volume;
                exercise.maxWeight = Math.max(exercise.maxWeight, point.maxWeight);
                exercise.points.push(point);
                maps[group].set(name, exercise);
            }));
            return Object.fromEntries(Object.entries(maps).map(([group, map]) => [group, [...map.values()].map(exercise => ({ ...exercise, points: exercise.points.sort((a, b) => a.date.localeCompare(b.date)) })).sort((a, b) => b.totalSets - a.totalSets || b.points.length - a.points.length)]));
        }

        const sportsGroupNames = { chest: '胸', back: '背', leg: '腿' };

        function applySportsGroup(group) {
            const active = group || sportsState.filter;
            document.querySelectorAll('.fitness-calendar-day[data-trained="true"]').forEach(day => {
                const match = !active || String(day.dataset.group || '').split(' ').includes(active);
                day.classList.toggle('is-match', Boolean(active && match));
                day.classList.toggle('is-muted', Boolean(active && !match));
            });
            document.querySelectorAll('.fitness-filter').forEach(button => {
                const selected = sportsState.filter === button.dataset.group;
                button.classList.toggle('is-active', selected || Boolean(group && group === button.dataset.group));
                button.setAttribute('aria-pressed', selected ? 'true' : 'false');
            });
            const status = document.getElementById('fitness-filter-status');
            if (status) {
                const count = active ? document.querySelectorAll(`.fitness-calendar-day[data-group~="${active}"]`).length : 0;
                status.textContent = active ? `${sportsGroupNames[active]}部训练 · ${count} 个日期` : (sportsState.timelineRange || '悬停或点击胸、背、腿筛选训练日期');
            }
        }

        function previewSportsGroup(group) {
            sportsState.preview = group;
            applySportsGroup(group);
        }

        function clearSportsPreview() {
            sportsState.preview = null;
            applySportsGroup(null);
        }

        function toggleSportsGroup(group) {
            sportsState.filter = sportsState.filter === group ? null : group;
            sportsState.preview = null;

        function toggleSportsMuscleCard(group) {
            const card = document.querySelector(`.fitness-muscle-card[data-group="${group}"]`);
            if (!card) return;
            const open = !card.classList.contains('is-open');

        function showSportsExercise(group, encodedName) {
            const name = decodeURIComponent(encodedName);
            const exercise = (sportsState.exerciseGroups?.[group] || []).find(item => item.name === name);
            const card = document.querySelector(`.fitness-muscle-card[data-group="${group}"]`);
            if (!exercise || !card) return;
            sportsState.activeExercise[group] = name;
            card.classList.add('is-open');
            card.querySelectorAll('.fitness-exercise-button').forEach(button => button.classList.toggle('is-active', button.dataset.exercise === name));
            const summary = card.querySelector('.fitness-exercise-summary');
            if (summary) summary.innerHTML = `<strong>${escapeHtml(name)}</strong><span>${sportsNumber(exercise.points.length)} 次 · ${sportsNumber(exercise.totalSets)} 组 · ${sportsNumber(exercise.totalVolume / 1000, 1)} T · 最高 ${exercise.maxWeight ? `${sportsNumber(exercise.maxWeight, 1)} KG` : '—'}</span>`;
            const chartShell = card.querySelector('.fitness-exercise-chart-shell');
            if (chartShell) chartShell.classList.add('has-chart');
            const canvas = card.querySelector('.fitness-exercise-chart');
            requestAnimationFrame(() => requestAnimationFrame(() => drawSportsExerciseChart(canvas, exercise)));
        }

        function sportsWeeks(sessions, count = 12) {
            const today = new Date();
            today.setHours(12, 0, 0, 0);
            const monday = new Date(today);
            monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
            const weeks = Array.from({ length: count }, (_, index) => {
                const start = new Date(monday);
                start.setDate(monday.getDate() - (count - 1 - index) * 7);
                const end = new Date(start);
                end.setDate(start.getDate() + 7);
                return { start, end, volume: 0, sessions: 0, minutes: 0, label: `${start.getMonth() + 1}/${start.getDate()}` };
            });
            sessions.forEach(session => {
                const date = new Date(`${String(session.date || '').slice(0, 10)}T12:00:00`);
                const week = weeks.find(item => date >= item.start && date < item.end);
                if (!week) return;
                week.volume += Number(session.volumeKg || 0);
                week.minutes += Number(session.durationMinutes || 0);
                week.sessions += 1;
            });
            return weeks;
        }

        function drawSportsChart(canvas, values, options = {}) {
            if (!canvas) return;
            const width = Math.max(280, canvas.clientWidth || 600);
            const height = Math.max(140, canvas.clientHeight || 220);
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            const ctx = canvas.getContext('2d');
            ctx.scale(ratio, ratio);
            ctx.clearRect(0, 0, width, height);
            const pad = { left: 8, right: 10, top: 14, bottom: 27 };
            const chartW = width - pad.left - pad.right;
            const chartH = height - pad.top - pad.bottom;
            const numeric = values.map(value => Number(value) || 0);
            const max = Math.max(...numeric, 1);
            ctx.strokeStyle = 'rgba(17,17,17,.12)';
            ctx.lineWidth = 1;
            for (let row = 0; row <= 3; row += 1) {
                const y = pad.top + chartH * row / 3;
                ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
            }
            if (!numeric.some(value => value > 0)) {
                ctx.fillStyle = 'rgba(17,17,17,.42)';
                ctx.font = '10px "Noto Sans SC", sans-serif';
                ctx.fillText('等待更多数据形成趋势', pad.left, pad.top + chartH / 2);
                return;
            }
            const step = chartW / Math.max(numeric.length, 1);
            if (options.bars) {
                numeric.forEach((value, index) => {
                    const h = Math.max(value ? 2 : 0, value / max * chartH);
                    const x = pad.left + index * step + step * .18;
                    const y = pad.top + chartH - h;
                    const gradient = ctx.createLinearGradient(0, y, 0, pad.top + chartH);
                    gradient.addColorStop(0, options.color || '#ff1593');
                    gradient.addColorStop(1, 'rgba(255,21,147,.08)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, Math.max(2, step * .62), h);
                });
            } else {
                const points = numeric.map((value, index) => ({
                    x: numeric.length === 1 ? pad.left + chartW / 2 : pad.left + chartW * index / (numeric.length - 1),
                    y: pad.top + chartH - value / max * chartH
                }));
                const fill = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
                fill.addColorStop(0, 'rgba(255,21,147,.22)'); fill.addColorStop(1, 'rgba(255,21,147,0)');
                ctx.beginPath(); ctx.moveTo(points[0].x, pad.top + chartH); points.forEach(point => ctx.lineTo(point.x, point.y)); ctx.lineTo(points[points.length - 1].x, pad.top + chartH); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
                ctx.beginPath(); points.forEach((point, index) => index ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y));
                ctx.strokeStyle = options.color || '#ff1593'; ctx.lineWidth = 2; ctx.stroke();
                points.forEach(point => { ctx.beginPath(); ctx.arc(point.x, point.y, 2.6, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); });
            }
            const labels = options.labels || [];
            ctx.fillStyle = 'rgba(17,17,17,.46)';
            ctx.font = '8px "Noto Sans SC", sans-serif';
            const labelIndexes = [...new Set([0, Math.floor((labels.length - 1) / 2), labels.length - 1])].filter(index => index >= 0);
            labelIndexes.forEach(index => {
                const x = labels.length === 1 ? pad.left + chartW / 2 : pad.left + chartW * index / Math.max(labels.length - 1, 1);
                ctx.fillText(labels[index] || '', Math.min(x, width - 34), height - 7);
            });
        }

        function drawSportsExerciseChart(canvas, exercise) {
            if (!canvas || !exercise?.points?.length) return;
            const points = exercise.points;
            const width = Math.max(280, canvas.clientWidth || 520);
            const height = Math.max(170, canvas.clientHeight || 190);
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * ratio);
            canvas.height = Math.round(height * ratio);
            const ctx = canvas.getContext('2d');
            ctx.scale(ratio, ratio);
            ctx.clearRect(0, 0, width, height);
            const pad = { left: 12, right: 12, top: 18, bottom: 29 };
            const chartW = width - pad.left - pad.right;
            const chartH = height - pad.top - pad.bottom;
            const maxVolume = Math.max(1, ...points.map(point => point.volume));
            const maxSets = Math.max(1, ...points.map(point => point.sets));
            const step = chartW / Math.max(points.length, 1);
            ctx.strokeStyle = 'rgba(17,17,17,.12)';
            ctx.lineWidth = 1;
            for (let row = 0; row <= 3; row += 1) {
                const y = pad.top + chartH * row / 3;
                ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
            }
            points.forEach((point, index) => {
                const barHeight = point.volume ? Math.max(3, point.volume / maxVolume * chartH) : 0;
                const x = pad.left + index * step + step * .14;
                const y = pad.top + chartH - barHeight;
                ctx.fillStyle = 'rgba(255,21,147,.38)';
                ctx.fillRect(x, y, Math.max(2, step * .68), barHeight);
            });
            const linePoints = points.map((point, index) => ({
                x: points.length === 1 ? pad.left + chartW / 2 : pad.left + chartW * index / (points.length - 1),
                y: pad.top + chartH - point.sets / maxSets * chartH
            }));
            ctx.beginPath();
            linePoints.forEach((point, index) => index ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y));
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2.2; ctx.stroke();
            linePoints.forEach(point => { ctx.beginPath(); ctx.arc(point.x, point.y, 2.7, 0, Math.PI * 2); ctx.fillStyle = '#ff1593'; ctx.fill(); });
            ctx.fillStyle = 'rgba(17,17,17,.52)';
            ctx.font = '8px Arial, sans-serif';
            const labelIndexes = [...new Set([0, Math.floor((points.length - 1) / 2), points.length - 1])];
            labelIndexes.forEach(index => {
                const x = points.length === 1 ? pad.left + chartW / 2 : pad.left + chartW * index / Math.max(points.length - 1, 1);
                ctx.fillText(sportsDate(points[index]?.date), Math.min(x, width - 38), height - 8);
            });
        }

        function drawSportsCharts() {
            if (!document.body.classList.contains('sports-page') || !sportsState.data) return;
            const sessions = Array.isArray(sportsState.data.training?.sessions) ? sportsState.data.training.sessions : [];
            const weeks = sportsWeeks(sessions);
            drawSportsChart(document.getElementById('training-volume-chart'), weeks.map(week => week.volume), { bars: true, labels: weeks.map(week => week.label) });
            const weights = (sportsState.data.body?.records || []).filter(item => item.type === 'weight').slice(-28);
            drawSportsChart(document.getElementById('training-body-chart'), weights.map(item => item.value), { labels: weights.map(item => sportsDate(item.date)), color: '#111' });
            Object.entries(sportsState.activeExercise || {}).forEach(([group, name]) => {
                const exercise = (sportsState.exerciseGroups?.[group] || []).find(item => item.name === name);
                const canvas = document.querySelector(`.fitness-muscle-card[data-group="${group}"] .fitness-exercise-chart`);
                if (exercise) drawSportsExerciseChart(canvas, exercise);
            });
        }

        function renderSportsData(data) {
            sportsState.data = data;
            const sessions = (Array.isArray(data.training?.sessions) ? data.training.sessions : []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || Number(b.start || 0) - Number(a.start || 0));
            const records = Array.isArray(data.body?.records) ? data.body.records : [];
            const now = Date.now();
            const recent = sessions.filter(session => {
                const time = new Date(`${String(session.date || '').slice(0, 10)}T12:00:00`).getTime();
                return Number.isFinite(time) && now - time <= 30 * 86400000;
            });
            const volume = recent.reduce((sum, session) => sum + Number(session.volumeKg || 0), 0);
            const minutes = recent.reduce((sum, session) => sum + Number(session.durationMinutes || 0), 0);
            const latestWeight = records.filter(item => item.type === 'weight').slice(-1)[0];
            const latestBodyfat = records.filter(item => item.type === 'bodyfat').slice(-1)[0];
            const timelineMap = new Map();
            sessions.forEach(session => {
                const date = String(session.date || '').slice(0, 10);
                if (!date) return;
                const entry = timelineMap.get(date) || { date, title: [], setCount: 0, volumeKg: 0, groups: new Set() };
                const group = sportsGroup(session);
                entry.title.push(String(session.title || '训练'));
                entry.setCount += Number(session.setCount || 0);
                entry.volumeKg += Number(session.volumeKg || 0);
                if (group !== 'other') entry.groups.add(group);
                timelineMap.set(date, entry);
            });
            const timelineSessions = [...timelineMap.values()].map(entry => ({ ...entry, title: [...new Set(entry.title)].join(' / '), group: [...entry.groups].join(' ') || 'other' })).sort((a, b) => a.date.localeCompare(b.date));
            const groupCounts = timelineSessions.reduce((counts, session) => {
                String(session.group || '').split(' ').forEach(group => {
                    if (group in counts) counts[group] += 1;
                });
                return counts;
            }, { chest: 0, back: 0, leg: 0 });
            const exerciseGroups = sportsExerciseGroups(sessions);
            sportsState.exerciseGroups = exerciseGroups;
            sportsState.activeExercise = {};
            sportsState.timelineRange = timelineSessions.length ? `${sportsFullDate(timelineSessions[0].date)} → ${sportsFullDate(timelineSessions[timelineSessions.length - 1].date)} · ${timelineSessions.length} 个日期全部显示` : '';
            const groupMeta = {
                chest: { en: 'CHEST', zh: '胸部', tool: 'tool-chest' },
                back: { en: 'BACK', zh: '背部', tool: 'tool-back' },
                leg: { en: 'LEGS', zh: '腿部', tool: 'tool-leg' }
            };
            const muscleCards = Object.entries(groupMeta).map(([group, meta]) => {
                const exercises = (exerciseGroups[group] || []).slice(0, 6);
                const top = exercises[0];
                const exerciseButtons = exercises.map(exercise => {
                    const encoded = encodeURIComponent(exercise.name);
                    return `<button type="button" class="fitness-exercise-button" data-exercise="${escapeHtml(exercise.name)}" onmouseenter="showSportsExercise('${group}','${encoded}')" onfocus="showSportsExercise('${group}','${encoded}')" onclick="event.stopPropagation();showSportsExercise('${group}','${encoded}')">${escapeHtml(exercise.name)} · ${sportsNumber(exercise.totalSets)}组</button>`;
                }).join('');
                return `<article class="fitness-muscle-card" data-group="${group}" onmouseenter="previewSportsGroup('${group}')" onmouseleave="clearSportsPreview()">
                    <button type="button" class="fitness-muscle-toggle" onclick="toggleSportsMuscleCard('${group}')" onfocus="previewSportsGroup('${group}')" onblur="clearSportsPreview()" aria-label="展开${meta.zh}动作档案">
                        <span class="fitness-tool-icon ${meta.tool}"><i></i><b></b></span>
                        <span class="fitness-muscle-name"><strong>${meta.en}</strong><small>${meta.zh} · ${groupCounts[group]} 个训练日期</small></span>
                        <span class="fitness-muscle-plus">＋</span>
                    </button>
                    <div class="fitness-muscle-content">
                        <div class="fitness-muscle-feature"><div><span>MOST PRACTICED / 最常练</span><strong>${top ? escapeHtml(top.name) : '等待动作记录'}</strong></div><span class="fitness-move-sketch"><span class="fitness-tool-icon ${meta.tool}"><i></i><b></b></span></span></div>
                        <div class="fitness-exercise-list">${exerciseButtons || '<span class="fitness-stage-caption"><small>等待动作数据</small></span>'}</div>
                        <div class="fitness-exercise-chart-shell">
                            <div class="fitness-exercise-summary"><strong>动作历史</strong><span>悬停动作查看全部记录</span></div>
                            <canvas class="fitness-exercise-chart" aria-label="${meta.zh}动作历史数据图"></canvas>
                            <div class="fitness-exercise-legend"><span>训练容量</span><span>完成组数</span></div>
                        </div>
                    </div>
                </article>`;
            }).join('');
            const updatedAt = data.updatedAt ? new Date(data.updatedAt) : null;
            const updatedLabel = updatedAt && !Number.isNaN(updatedAt.getTime()) ? new Intl.DateTimeFormat('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }).format(updatedAt) : '等待首次同步';
            const calendarLookup = new Map(timelineSessions.map(session => [session.date, session]));
            const calendarLoads = timelineSessions.map(session => Math.max(Number(session.volumeKg || 0), Number(session.setCount || 0) * 100)).filter(Boolean).sort((a, b) => a - b);
            const calendarCut = ratio => calendarLoads[Math.min(calendarLoads.length - 1, Math.floor((calendarLoads.length - 1) * ratio))] || 0;
            const calendarCuts = [calendarCut(.25), calendarCut(.5), calendarCut(.75)];
            const firstTrainingDate = timelineSessions[0]?.date;
            const lastTrainingDate = timelineSessions[timelineSessions.length - 1]?.date;
            const calendarStart = firstTrainingDate ? new Date(`${firstTrainingDate}T12:00:00Z`) : new Date();
            calendarStart.setUTCDate(calendarStart.getUTCDate() - calendarStart.getUTCDay());
            const calendarEnd = lastTrainingDate ? new Date(`${lastTrainingDate}T12:00:00Z`) : new Date(calendarStart);
            calendarEnd.setUTCDate(calendarEnd.getUTCDate() + (6 - calendarEnd.getUTCDay()));
            const calendarDays = [];
            for (const cursor = new Date(calendarStart); cursor <= calendarEnd; cursor.setUTCDate(cursor.getUTCDate() + 1)) calendarDays.push(new Date(cursor));
            const calendarWeeks = Math.max(1, Math.ceil(calendarDays.length / 7));
            const dateKey = date => `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')}`;
            const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const monthPositions = new Map();
            calendarDays.forEach((date, index) => {
                const key = `${date.getUTCFullYear()}-${date.getUTCMonth()}`;
                if (!monthPositions.has(key)) monthPositions.set(key, { label: monthNames[date.getUTCMonth()], week: Math.floor(index / 7) + 1 });
            });
            const calendarMonths = [...monthPositions.values()].map(month => `<span class="fitness-calendar-month" style="grid-column:${month.week}">${month.label}</span>`).join('');
            const calendarCells = calendarDays.map(date => {
                const key = dateKey(date);
                const session = calendarLookup.get(key);
                const outside = key < firstTrainingDate || key > lastTrainingDate;
                if (!session) return `<span class="fitness-calendar-day${outside ? ' is-outside' : ''}" data-level="0" aria-hidden="true"></span>`;
                const load = Math.max(Number(session.volumeKg || 0), Number(session.setCount || 0) * 100);
                const level = load >= calendarCuts[2] ? 4 : load >= calendarCuts[1] ? 3 : load >= calendarCuts[0] ? 2 : 1;
                const label = `${sportsFullDate(key)}，${session.title || '训练'}，${sportsNumber(session.setCount)}组，${sportsNumber(Number(session.volumeKg || 0) / 1000, 1)}吨`;
                return `<button type="button" class="fitness-calendar-day" data-trained="true" data-group="${session.group}" data-level="${level}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}"></button>`;
            }).join('');

            app.innerHTML = `
                <main class="training-room">
                    <div class="training-shell">
                        <section class="fitness-stage" aria-label="全年训练频率">
                            <div class="fitness-stage-top">
                                <div class="fitness-stage-caption">${timelineSessions.length} TRAINING DAYS<small id="fitness-filter-status">${escapeHtml(sportsState.timelineRange || '等待训练日期')}</small></div>
                                <div class="fitness-filters" role="group" aria-label="按训练部位筛选">
                                    <button type="button" class="fitness-filter" data-group="chest" aria-pressed="false" onmouseenter="previewSportsGroup('chest')" onmouseleave="clearSportsPreview()" onfocus="previewSportsGroup('chest')" onblur="clearSportsPreview()" onclick="toggleSportsGroup('chest')"><span class="fitness-tool-icon tool-chest"><i></i><b></b></span><span><strong>CHEST</strong><small>胸 · ${groupCounts.chest}</small></span></button>
                                    <button type="button" class="fitness-filter" data-group="back" aria-pressed="false" onmouseenter="previewSportsGroup('back')" onmouseleave="clearSportsPreview()" onfocus="previewSportsGroup('back')" onblur="clearSportsPreview()" onclick="toggleSportsGroup('back')"><span class="fitness-tool-icon tool-back"><i></i><b></b></span><span><strong>BACK</strong><small>背 · ${groupCounts.back}</small></span></button>
                                    <button type="button" class="fitness-filter" data-group="leg" aria-pressed="false" onmouseenter="previewSportsGroup('leg')" onmouseleave="clearSportsPreview()" onfocus="previewSportsGroup('leg')" onblur="clearSportsPreview()" onclick="toggleSportsGroup('leg')"><span class="fitness-tool-icon tool-leg"><i></i><b></b></span><span><strong>LEGS</strong><small>腿 · ${groupCounts.leg}</small></span></button>
                                </div>
                            </div>
                            <div class="fitness-calendar-scroll">
                                <div class="fitness-calendar" style="--week-count:${calendarWeeks}">
                                    <div class="fitness-calendar-months">${calendarMonths}</div>
                                    <div class="fitness-calendar-body">
                                        <div class="fitness-calendar-weekdays" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
                                        <div class="fitness-calendar-grid">${calendarCells}</div>
                                    </div>
                                    <div class="fitness-calendar-foot"><span>从第一次记录开始，每个方格代表一天</span><span class="fitness-calendar-legend">Less<i></i><i></i><i></i><i></i><i></i>More</span></div>
                                </div>
                            </div>
                        </section>
                        <section class="fitness-muscle-grid" aria-label="胸背腿动作档案">${muscleCards}</section>
                        <section class="fitness-summary" aria-label="最近三十天训练摘要">
                            <article class="fitness-stat"><span>30 DAYS / 训练次数</span><strong>${sportsNumber(recent.length)}<small>次</small></strong></article>
                            <article class="fitness-stat"><span>TOTAL VOLUME / 总容量</span><strong>${sportsNumber(volume / 1000, 1)}<small>T</small></strong></article>
                            <article class="fitness-stat"><span>TIME UNDER WORK / 时长</span><strong>${sportsNumber(minutes / 60, 1)}<small>H</small></strong></article>
                            <article class="fitness-stat"><span>BODY / 最近体重</span><strong>${latestWeight ? sportsNumber(latestWeight.value, 1) : '—'}<small>${latestWeight?.unit || 'KG'}</small></strong></article>
                        </section>
                        <div class="fitness-detail-grid">
                            <section class="fitness-card">
                                <div class="fitness-card-head"><strong>12 WEEK POWER</strong><span>每周训练容量 / KG</span></div>
                                <div class="fitness-chart-wrap"><canvas id="training-volume-chart" class="training-chart" aria-label="近十二周训练容量图"></canvas></div>
                            </section>
                            <aside class="fitness-side">
                                <section class="fitness-card">
                                    <div class="fitness-card-head"><strong>BODY TRACE</strong><span>身体趋势</span></div>
                                    <div class="fitness-body-number">${latestWeight ? sportsNumber(latestWeight.value, 1) : '—'} <small>${latestWeight?.unit || 'kg'} · ${latestBodyfat ? `体脂 ${sportsNumber(latestBodyfat.value, 1)}${latestBodyfat.unit || '%'}` : '持续记录中'}</small></div>
                                    <div class="fitness-chart-wrap"><canvas id="training-body-chart" class="training-chart body-chart" aria-label="体重变化趋势图"></canvas></div>
                                </section>
                            </aside>
                            <section class="fitness-card fitness-latest">
                                <div class="fitness-card-head"><strong>LATEST REPS</strong><span>最近训练 · 数据更新 ${escapeHtml(updatedLabel)}</span></div>
                                <div class="fitness-session-strip">${sessions.length ? sessions.slice(0, 6).map(session => `<article class="fitness-session"><time>${escapeHtml(sportsDate(session.date))}</time><strong>${escapeHtml(session.title || '训练')}</strong><span>${sportsNumber(session.durationMinutes)} MIN · ${sportsNumber(session.setCount)} SETS · ${sportsNumber(Number(session.volumeKg || 0) / 1000, 1)} T</span></article>`).join('') : '<article class="fitness-session"><strong>等待首次训练同步</strong></article>'}</div>
                            </section>
                        </div>
                    </div>
                </main>`;
            requestAnimationFrame(() => {
                drawSportsCharts();
                applySportsGroup(null);
                const calendar = document.querySelector('.fitness-calendar-scroll');
                if (calendar) calendar.scrollLeft = calendar.scrollWidth - calendar.clientWidth;
            });
        }

        async function loadSportsData() {
            try {
                const response = await fetch(`data/synfit.json?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('sync unavailable');
                const data = await response.json();
                if (data.status !== 'ready') throw new Error('sync pending');
                renderSportsData(data);
            } catch (_) {
                app.innerHTML = `<main class="training-room"><div class="training-empty"><div><div class="training-empty-dot"></div><span class="en-main text-xs">SYNFIT SYNC STANDBY</span><span class="zh-sub mt-3 opacity-70">训练档案正在等待首次同步，稍后会自动出现。</span></div></div></main>`;
            }
        }

        function renderSports() {
            app.innerHTML = `<main class="training-room"><div class="training-empty"><div><div class="training-empty-dot"></div><span class="en-main text-xs">READING TRAINING ARCHIVE</span><span class="zh-sub mt-3 opacity-70">正在整理训练与身体趋势</span></div></div></main>`;
            if (!sportsState.resizeBound) {
                sportsState.resizeBound = true;
                window.addEventListener('resize', () => {
                    window.clearTimeout(sportsState.resizeTimer);
                    sportsState.resizeTimer = window.setTimeout(drawSportsCharts, 120);
                });
            }
            loadSportsData();
        }

        function renderPhoto() {
            const cats = [{id:'商业摄影', en:'Commercial', zh:'商业摄影'}, {id:'模特', en:'Model', zh:'模特'}, {id:'情绪摄影', en:'Mood', zh:'情绪摄影'}, {id:'自媒体摄影', en:'Social', zh:'自媒体摄影'}, {id:'video', en:'Visuals', zh:'视听影像'}];
            app.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8 px-4 min-h-[70vh]">
                    <div class="md:w-1/4 flex flex-col gap-3">
                        <div class="mb-4"><span class="en-main text-5xl">Photography</span><span class="zh-sub text-xs mt-1">摄影</span></div>
                        ${cats.map(c => `<div onclick="handlePhotoNav('${c.id}', this)" class="photo-nav-item glass p-5 cursor-pointer hover:bg-white/10 transition-all border-transparent">
                            <span class="en-main text-lg">${c.en}</span><span class="zh-sub text-[9px]">${c.zh}</span>
                        </div>`).join('')}
                    </div>
                    <div class="flex-1 glass p-4 overflow-y-auto max-h-[85vh] no-scrollbar"><div id="photo-content-area"></div></div>
                </div>`;
            handlePhotoNav('商业摄影', document.querySelector('.photo-nav-item'));
        }

        function handlePhotoNav(id, el) {
            document.querySelectorAll('.photo-nav-item').forEach(i => i.classList.remove('nav-active'));
            el.classList.add('nav-active');
            const area = document.getElementById('photo-content-area');
            
            const photoCfg = { 
                '商业摄影': { path: '摄影/商业摄影', ext: '.jpg' }, 
                '模特': { path: '模特/模特', ext: '.JPG' }, 
                '情绪摄影': { path: '摄影/情绪摄影', ext: '.jpg' }, 
                '自媒体摄影': { path: '摄影/自媒体摄影', ext: '.jpg' } 
            };
            
            if(id === 'video') {
                const links = ["https://sns-video-zl.xhscdn.com/stream/79/110/115/01e805fb570d7ef74f03700196576619b1_115.mp4", "https://sns-video-zl.xhscdn.com/stream/110/4/01e6cd6d950f58330103700391927eff1a_4.mp4", "https://www.chali.com/material/brand/ys/video1.mp4", "https://sns-video-zl.xhscdn.com/stream/1/110/115/01e92c5c4c1b1c6c010370019ad553c5f4_115.mp4"];
                area.className = "grid md:grid-cols-2 gap-4 animate-in fade-in duration-700";
                area.innerHTML = links.map(l => `<div class="video-card-mini glass p-1"><video loop muted playsinline autoplay preload="metadata" class="w-full h-full object-cover rounded-xl"><source src="${l}"></video></div>`).join('');
            } else {
                area.className = "tight-photo-grid animate-in fade-in duration-700";
                area.innerHTML = '';
                const cfg = photoCfg[id];
                for(let i=1; i<=50; i++) {
                    const div = document.createElement('div'); 
                    div.className = 'photo-item';
                    const img = document.createElement('img');
                    img.src = `${cfg.path}${i}${cfg.ext}`;
                    img.className = 'w-full h-auto cursor-zoom-in';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.alt = `${id}-${i}`;
                    img.onclick = () => openViewerSingle(img.src);
                    img.onerror = function() { this.parentElement.remove(); };
                    div.appendChild(img);
                    area.appendChild(div);
                }
            }
        }

        const siteSections = new Set(['home', 'photo', 'coach', 'cinema', 'works', 'reading', 'thoughts', 'calligraphy', 'sports']);

        function sectionFromUrl() {
            const section = new URL(window.location.href).searchParams.get('section') || 'home';
            return siteSections.has(section) ? section : 'home';
        }

        function updateSectionRoute(page, replace = false) {
            const url = new URL(window.location.href);
            if (page === 'home') url.searchParams.delete('section');
            else url.searchParams.set('section', page);
            const method = replace ? 'replaceState' : 'pushState';
            history[method]({ page }, '', `${url.pathname}${url.search}${url.hash}`);
        }

        function switchPage(page, { updateHistory = true } = {}) {
            if (!siteSections.has(page)) page = 'home';
            if (updateHistory && sectionFromUrl() !== page) updateSectionRoute(page);
            if (page === 'home') restoreMainAudioFromReading();
            if (page !== 'calligraphy') {
                window.clearTimeout(calligraphyState.refreshTimer);
                calligraphyState.refreshTimer = 0;
            }
            app.style.opacity = '0';
            setTimeout(() => {
                backBtn.classList.toggle('hidden', page === 'home');
                document.body.classList.toggle('reading-page', page === 'reading');
                document.body.classList.toggle('calligraphy-page', page === 'calligraphy');
                document.body.classList.toggle('sports-page', page === 'sports');
                
                const isMobile = window.innerWidth < 768;
                if (page === 'calligraphy' || page === 'sports') {
                    document.body.style.backgroundImage = 'none';
                } else if (page === 'thoughts') {
                    document.body.style.backgroundImage = isMobile ? "url('反思竖屏.jpg')" : "url('反思横屏.jpg')";
                } else {
                    document.body.style.backgroundImage = isMobile ? "url('mobile_bg.jpg')" : "url('horse.jpg')";
                }

                if(page === 'home') renderHome();
                else if(page === 'photo') renderPhoto();
                else if(page === 'coach') renderCoach();
                else if(page === 'cinema') renderCinema();
                else if(page === 'works') renderWorks();
                else if(page === 'reading') renderReading();
                else if(page === 'thoughts') renderThoughts();
                else if(page === 'calligraphy') renderCalligraphy();
                else if(page === 'sports') renderSports();
                
                app.style.opacity = '1'; window.scrollTo(0,0);
            }, 400);
        }

        function updateMovieGrid(list) {
            const container = document.getElementById('movie-names');
            if(container) {
                container.innerHTML = list.slice(0, 160).map(m => {
                    const titles = m.title.split(' / ');
                    const mainTitle = titles[0];
                    const altTitle = titles[1] || '';
                    return `<a href="${getImdbUrl(mainTitle)}" target="_blank" rel="noopener noreferrer" class="block border-l border-white/5 pl-2 transition-all hover:opacity-100 opacity-30">
                        <div class="en-main text-[9px] truncate">${altTitle || mainTitle}</div>
                        <div class="zh-sub text-[8px] truncate">${mainTitle}</div>
                    </a>`;
                }).join('');
            }
        }

        function liveSearch() {
            const val = document.getElementById('movieSearch').value.toLowerCase();
            updateMovieGrid(movieData.filter(m => m.title.toLowerCase().includes(val)));
        }
        
        function handleSearchEnter(e) {
            if (e.key === 'Enter') {
                const term = e.target.value.trim().toLowerCase();
                if (term !== '' && !movieData.some(m => m.title.toLowerCase().includes(term))) {
                    document.getElementById('ad-pop').style.display = 'flex';
                }
            }
        }

        function openViewerList(prefix, index, count) {
            currentImgList = Array.from({length: count}, (_, i) => `${prefix}${i+1}.png`);
            currentIndex = index - 1;
            updateViewer();
            document.getElementById('viewer').style.display = 'flex';
        }

        function openViewerSingle(src) {
            currentImgList = [src];
            currentIndex = 0;
            updateViewer();
            document.getElementById('viewer').style.display = 'flex';
        }

        function closeViewer() { document.getElementById('viewer').style.display = 'none'; }
        function nextImg() { if(currentImgList.length <= 1) return; currentIndex = (currentIndex + 1) % currentImgList.length; updateViewer(); }
        function prevImg() { if(currentImgList.length <= 1) return; currentIndex = (currentIndex - 1 + currentImgList.length) % currentImgList.length; updateViewer(); }
        function updateViewer() { document.getElementById('viewer-img').src = currentImgList[currentIndex]; }
        function closeAd() { document.getElementById('ad-pop').style.display = 'none'; }

        window.addEventListener('popstate', () => switchPage(sectionFromUrl(), { updateHistory: false }));
        window.onload = () => {
            const initialSection = sectionFromUrl();
            updateSectionRoute(initialSection, true);
            if (initialSection === 'home') {
                renderHome();
                app.style.opacity = '1';
            } else {
                switchPage(initialSection, { updateHistory: false });
            }
        };
    </script>
