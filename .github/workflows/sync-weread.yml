name: Sync WeRead showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/sync-weread.yml"

permissions:
  contents: write

concurrency:
  group: sync-weread-showcase
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch public showcase data
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gateway() {
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${WEREAD_API_KEY}" \
              -H "Content-Type: application/json" \
              --data "$1" \
              "https://i.weread.qq.com/api/agent/gateway"
          }

          check_payload() {
            if ! jq -e '((.errcode // 0) == 0) and (has("upgrade_info") | not)' <<<"$1" >/dev/null; then
              jq -c '{errcode,errmsg,upgrade_info}' <<<"$1" >&2
              return 1
            fi
          }

          shelf="$(gateway '{"api_name":"/shelf/sync","skill_version":"1.0.5"}')"
          monthly="$(gateway '{"api_name":"/readdata/detail","skill_version":"1.0.5","mode":"monthly","baseTime":0}')"
          overall="$(gateway '{"api_name":"/readdata/detail","skill_version":"1.0.5","mode":"overall","baseTime":0}')"

          for payload in "$shelf" "$monthly" "$overall"; do
            check_payload "$payload"
          done

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          printf '%s\n' "$shelf" > "$work_dir/shelf.json"
          printf '%s\n' "$monthly" > "$work_dir/monthly.json"
          printf '%s\n' "$overall" > "$work_dir/overall.json"

          notebook_entries="$work_dir/notebooks.ndjson"
          : > "$notebook_entries"
          last_sort=''
          notebook_page=0
          while [ "$notebook_page" -lt 100 ]; do
            if [ -n "$last_sort" ]; then
              notebook_request="$(jq -cn --argjson lastSort "$last_sort" \
                '{api_name:"/user/notebooks",skill_version:"1.0.5",count:100,lastSort:$lastSort}')"
            else
              notebook_request='{"api_name":"/user/notebooks","skill_version":"1.0.5","count":100}'
            fi
            notebook_result="$(gateway "$notebook_request")"
            check_payload "$notebook_result"
            jq -c '.books[]?' <<<"$notebook_result" >> "$notebook_entries"

            if ! jq -e '(.hasMore == 1) or (.hasMore == true)' <<<"$notebook_result" >/dev/null; then
              break
            fi
            next_sort="$(jq -r '.books[-1].sort // empty' <<<"$notebook_result")"
            [ -n "$next_sort" ] && [ "$next_sort" != "$last_sort" ] || break
            last_sort="$next_sort"
            notebook_page=$((notebook_page + 1))
          done
          jq -s '{books:.}' "$notebook_entries" > "$work_dir/notebooks.json"

          annual_entries="$work_dir/annual.ndjson"
          : > "$annual_entries"
          current_year="$(date -u +%Y)"
          registration_time="$(jq -r '.registTime // 0' "$work_dir/overall.json")"
          if [ "$registration_time" -gt 0 ]; then
            registration_year="$(date -u -d "@${registration_time}" +%Y)"
          else
            registration_year="$current_year"
          fi
          for ((year=registration_year; year<=current_year; year++)); do
            base_time="$(date -u -d "${year}-01-01 00:00:00" +%s)"
            annual_request="$(jq -cn --argjson baseTime "$base_time" \
              '{api_name:"/readdata/detail",skill_version:"1.0.5",mode:"annually",baseTime:$baseTime}')"
            annual_result="$(gateway "$annual_request")"
            check_payload "$annual_result"
            printf '%s\n' "$annual_result" >> "$annual_entries"
          done
          jq -s '.' "$annual_entries" > "$work_dir/annual-reports.json"

          jq -n \
            --slurpfile shelf "$work_dir/shelf.json" \
            --slurpfile notebooks "$work_dir/notebooks.json" \
            --slurpfile overall "$work_dir/overall.json" \
            --slurpfile annual "$work_dir/annual-reports.json" '
              ($shelf[0]) as $shelf |
              ($notebooks[0]) as $notebooks |
              ($overall[0]) as $overall |
              ($annual[0]) as $annual |
              [
                ($notebooks.books[]? |
                  ((.book // {}) + {
                    bookId:(.bookId // .book.bookId),
                    readingProgress:.readingProgress,
                    markedStatus:.markedStatus,
                    lastNoteSort:.sort
                  }) | with_entries(select(.value != null))),
                $overall.readLongest[]?.book,
                $overall.preferBooks[]?.bookInfo,
                $annual[]?.readLongest[]?.book,
                $annual[]?.preferBooks[]?.bookInfo,
                $shelf.books[]?
              ]
              | map(select((.bookId // "") != ""))
              | reduce .[] as $book ({};
                  ($book.bookId | tostring) as $id |
                  .[$id] = ((.[$id] // {}) + $book)
                )
              | [.[]]
              | map(. + {
                  finishReading:(.finishReading // (if .markedStatus == 1 then 1 else 0 end))
                })
              | sort_by(-(.readUpdateTime // .lastNoteSort // .finishTime // .updateTime // 0), (.title // ""))
            ' > "$work_dir/history-books.json"

          total_read_count="$(jq -r '[.readStat[]? | select(.stat == "读过") | .counts | capture("(?<n>[0-9]+)").n][0] // "0"' "$work_dir/overall.json")"

          notes_entries="$work_dir/notes.ndjson"
          : > "$notes_entries"
          note_index=0
          while IFS= read -r book_id; do
            [ -n "$book_id" ] || continue

            highlights_request="$(jq -cn --arg bookId "$book_id" \
              '{api_name:"/book/bookmarklist",skill_version:"1.0.5",bookId:$bookId}')"
            highlights="$(gateway "$highlights_request")"
            check_payload "$highlights"
            highlights_file="$work_dir/highlights-${note_index}.json"
            printf '%s\n' "$highlights" > "$highlights_file"

            thought_entries="$work_dir/thoughts-${note_index}.ndjson"
            : > "$thought_entries"
            thought_synckey=0
            thought_page=0
            while [ "$thought_page" -lt 20 ]; do
              thoughts_request="$(jq -cn --arg bookid "$book_id" --argjson synckey "$thought_synckey" \
                '{api_name:"/review/list/mine",skill_version:"1.0.5",bookid:$bookid,synckey:$synckey,count:100}')"
              thoughts_page="$(gateway "$thoughts_request")"
              check_payload "$thoughts_page"
              jq -c '.reviews[]?' <<<"$thoughts_page" >> "$thought_entries"

              if ! jq -e '(.hasMore == 1) or (.hasMore == true)' <<<"$thoughts_page" >/dev/null; then
                break
              fi
              next_synckey="$(jq -r '.synckey // empty' <<<"$thoughts_page")"
              [ -n "$next_synckey" ] && [ "$next_synckey" != "$thought_synckey" ] || break
              thought_synckey="$next_synckey"
              thought_page=$((thought_page + 1))
            done

            thoughts_file="$work_dir/thoughts-${note_index}.json"
            jq -s '{reviews:.}' "$thought_entries" > "$thoughts_file"
            jq -cn \
              --arg bookId "$book_id" \
              --slurpfile highlights "$highlights_file" \
              --slurpfile thoughts "$thoughts_file" \
              '{key:$bookId,value:{highlights:$highlights[0],thoughts:$thoughts[0]}}' \
              >> "$notes_entries"
            note_index=$((note_index + 1))
          done < <(jq -r '.[]?.bookId // empty' "$work_dir/history-books.json")
          jq -s 'from_entries' "$notes_entries" > "$work_dir/notes.json"

          mkdir -p data
          jq -n \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile shelf "$work_dir/shelf.json" \
            --slurpfile monthly "$work_dir/monthly.json" \
            --slurpfile overall "$work_dir/overall.json" \
            --slurpfile notebooks "$work_dir/notebooks.json" \
            --slurpfile annualReports "$work_dir/annual-reports.json" \
            --slurpfile historyBooks "$work_dir/history-books.json" \
            --argjson totalReadCount "$total_read_count" \
            --slurpfile notesByBook "$work_dir/notes.json" \
            '{
              status:"ready",
              updatedAt:$updatedAt,
              shelf:$shelf[0],
              history:{books:$historyBooks[0],totalReadCount:$totalReadCount},
              notebooks:$notebooks[0],
              monthly:$monthly[0],
              overall:$overall[0],
              annualReports:$annualReports[0],
              notesByBook:$notesByBook[0]
            }' \
            > data/weread.json

      - name: Publish refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data/weread.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weread.json
          git commit -m "Update WeRead showcase data [skip ci]"
          git push
