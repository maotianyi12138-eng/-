name: Sync SynFit showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "28 2 * * *"
  push:
    paths:
      - ".github/workflows/sync-synfit.yml"
      - "scripts/sync-synfit.mjs"

permissions:
  contents: write

concurrency:
  group: sync-synfit-showcase
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build public SynFit summary
        env:
          SYNFIT_TRAINING_API_KEY: ${{ secrets.SYNFIT_TRAINING_API_KEY }}
          SYNFIT_BODY_API_KEY: ${{ secrets.SYNFIT_BODY_API_KEY }}
        run: node scripts/sync-synfit.mjs
      - name: Publish refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data/synfit.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/synfit.json
          git commit -m "Update SynFit showcase data [skip ci]"
          git pull --rebase origin main
          git push
